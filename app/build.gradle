plugins { id 'com.android.application' }

android {
    namespace 'ir.scooljavanrood.madreseyar.teacher'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.scooljavanrood.madreseyar.teacher'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-github-biometric-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// FileProvider for camera output without world-readable file:// URIs.
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
